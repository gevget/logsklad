services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: logsklad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logsklad-local-demo}
      POSTGRES_DB: logsklad
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - logsklad_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logsklad -d logsklad"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  logsklad_postgres_data:
